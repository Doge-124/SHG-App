name: Release

# Trigger: push a tag like v1.0.1 -> builds installer -> creates GitHub Release -> customers auto-update
on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workdir: src-tauri

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install root dependencies (Tauri CLI)
        run: npm ci

      # We build with `npm run tauri build` directly instead of `tauri-action@v0`.
      # tauri-action has a bug for Tauri v2: it deletes the .nsis.zip + .sig files
      # after deciding (incorrectly) not to upload them, leaving us with nothing to
      # construct latest.json from. Doing it ourselves keeps full control.
      - name: Build Tauri app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          NEXT_PUBLIC_APP_VERSION: ${{ github.ref_name }}
          # Phase 1 telemetry — heartbeat endpoint baked in at build time.
          # Leave secret unset to ship a no-op (zero network calls).
          TELEMETRY_ENDPOINT_URL: ${{ secrets.TELEMETRY_ENDPOINT_URL }}
        run: npm run tauri build

      - name: List build artifacts (debug)
        shell: pwsh
        run: |
          Write-Host "=== NSIS bundle dir ==="
          Get-ChildItem -Path src-tauri/target/release/bundle/nsis
          Write-Host ""
          Write-Host "=== MSI bundle dir ==="
          Get-ChildItem -Path src-tauri/target/release/bundle/msi

      - name: Create release and upload assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = '${{ github.ref_name }}'.TrimStart('v')
          $tag     = '${{ github.ref_name }}'
          $repo    = '${{ github.repository }}'
          $nsisDir = 'src-tauri/target/release/bundle/nsis'
          $msiDir  = 'src-tauri/target/release/bundle/msi'

          # Find the artifacts the bundler produced.
          # Note: with bundle.createUpdaterArtifacts=true, Tauri v2 signs the
          # installer .exe DIRECTLY (no separate .nsis.zip payload). The updater
          # downloads and runs the .exe, verifying it against the .sig content.
          $setupExe = Get-ChildItem -Path $nsisDir -Filter '*-setup.exe'     | Select-Object -First 1
          $setupSig = Get-ChildItem -Path $nsisDir -Filter '*-setup.exe.sig' | Select-Object -First 1
          $msiFile  = Get-ChildItem -Path $msiDir  -Filter '*.msi'           | Select-Object -First 1

          foreach ($pair in @(
              @{ name = 'setup.exe';     file = $setupExe },
              @{ name = 'setup.exe.sig'; file = $setupSig },
              @{ name = 'msi';           file = $msiFile  }
          )) {
              if (-not $pair.file) {
                  Write-Host "::error::Missing build artifact: $($pair.name)"
                  exit 1
              }
          }

          $signature = (Get-Content $setupSig.FullName -Raw).Trim()

          # Stable asset names (no spaces -> no URL-encoding surprises)
          $exeName = "SHG.Manager_${version}_x64-setup.exe"
          $sigName = "$exeName.sig"
          $msiName = "SHG.Manager_${version}_x64_en-US.msi"

          # Create the GitHub release (or skip if it already exists from a previous run).
          # Notes built with `+` instead of a here-string because here-strings would
          # need their closing `"@` at column 0, which breaks the YAML block scalar.
          $existing = gh release view $tag 2>$null
          if (-not $existing) {
              Write-Host "Creating release $tag"
              $notes = "## What's new in $tag`n`n" +
                       "See the commit history for details.`n`n" +
                       "### Installation`n" +
                       "- First time: download ``$exeName`` and run it`n" +
                       "- Existing users: the app will prompt to update automatically"
              gh release create $tag --title "SHG Manager $tag" --notes $notes
          } else {
              Write-Host "Release $tag already exists, will upload assets with --clobber"
          }

          # Upload all assets
          Write-Host "Uploading installers + updater signature..."
          gh release upload $tag `
            "$($setupExe.FullName)#$exeName" `
            "$($setupSig.FullName)#$sigName" `
            "$($msiFile.FullName)#$msiName"  `
            --clobber

          # Build and upload latest.json (the updater manifest).
          # url points to the signed .exe (Tauri v2 updater runs the installer directly).
          $pubDate = (Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ')
          $manifest = @{
              version   = $version
              notes     = "See https://github.com/$repo/releases/tag/$tag"
              pub_date  = $pubDate
              platforms = @{
                  'windows-x86_64' = @{
                      signature = $signature
                      url       = "https://github.com/$repo/releases/download/$tag/$exeName"
                  }
              }
          } | ConvertTo-Json -Depth 8

          [System.IO.File]::WriteAllText("$PWD/latest.json", $manifest)
          Write-Host "=== Generated latest.json ==="
          Get-Content latest.json
          Write-Host ""

          gh release upload $tag 'latest.json' --clobber
          Write-Host "Done. Customers' updater can now find this release."
