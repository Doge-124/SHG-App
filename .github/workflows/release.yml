name: Release

# Trigger: push a tag like v1.0.1 → builds installer → creates GitHub Release → customers auto-update
on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workdir: src-tauri

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install root dependencies (Tauri CLI)
        run: npm ci

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signing keys
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Sentry crash reporting (optional — leave secret unset to disable)
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          NEXT_PUBLIC_APP_VERSION: ${{ github.ref_name }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'SHG Manager ${{ github.ref_name }}'
          releaseBody: |
            ## What's new in ${{ github.ref_name }}

            See the commit history for details.

            ### Installation
            - **First time**: Download `SHG Manager_*_x64-setup.exe` and run it
            - **Existing users**: The app will prompt you to update automatically
          releaseDraft: false
          prerelease: false
          # Generates latest.json (the updater manifest) alongside the installers.
          # Without this the Tauri updater plugin gets 404 on the manifest URL.
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
