<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e40af"/>
      <stop offset="100%" stop-color="#0c1445"/>
    </linearGradient>
    <linearGradient id="coin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fcd34d"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>

  <!-- Background rounded square -->
  <rect width="1024" height="1024" rx="200" fill="url(#bg)"/>

  <!-- Subtle inner glow ring -->
  <rect width="1024" height="1024" rx="200" fill="none"
        stroke="#3b82f6" stroke-width="18" opacity="0.25"/>

  <!-- ── Building / institution icon ─────────────────────── -->

  <!-- Roof triangle -->
  <polygon points="190,418  512,198  834,418" fill="#93c5fd"/>
  <!-- Roof ridge beam -->
  <rect x="178" y="406" width="668" height="52" rx="14" fill="#bfdbfe"/>

  <!-- Building body (very faint fill so columns stand out) -->
  <rect x="228" y="452" width="568" height="346" rx="0" fill="#1e40af" opacity="0.4"/>

  <!-- Three columns -->
  <rect x="268" y="452" width="104" height="346" rx="10" fill="white"/>
  <rect x="460" y="452" width="104" height="346" rx="10" fill="white"/>
  <rect x="652" y="452" width="104" height="346" rx="10" fill="white"/>

  <!-- Base plinth -->
  <rect x="178" y="798" width="668" height="58" rx="12" fill="white"/>

  <!-- ── Gold coin badge (bottom-right) ───────────────────── -->
  <!-- Coin shadow / depth -->
  <circle cx="744" cy="772" r="118" fill="#92400e" opacity="0.5"/>
  <!-- Coin face -->
  <circle cx="736" cy="762" r="118" fill="url(#coin)"/>
  <!-- Coin rim -->
  <circle cx="736" cy="762" r="118" fill="none" stroke="#fef3c7" stroke-width="10" opacity="0.6"/>
  <!-- Rupee symbol drawn as paths (no font dependency) -->
  <!-- Top horizontal bar of ₹ -->
  <rect x="688" y="710" width="100" height="18" rx="9" fill="white"/>
  <!-- Second horizontal bar -->
  <rect x="688" y="742" width="100" height="18" rx="9" fill="white"/>
  <!-- Vertical stem -->
  <rect x="688" y="710" width="18" height="120" rx="9" fill="white"/>
  <!-- Diagonal slash (represents the crossing line in ₹) -->
  <line x1="706" y1="760" x2="800" y2="848" stroke="white" stroke-width="18"
        stroke-linecap="round"/>
</svg>
