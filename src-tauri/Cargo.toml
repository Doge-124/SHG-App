[package]
name = "app"
version = "1.0.53"
description = "SHG Manager - Financial management for Self Help Groups"
authors = ["Doge124"]
license = "UNLICENSED"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.9.5", features = [] }
tauri-plugin-log = { version = "2", features = ["colored"] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
# bundled-sqlcipher-vendored-openssl: vendors both SQLCipher AND OpenSSL into the
# build so we don't need OpenSSL pre-installed on CI runners. Slightly longer
# build time, but reliable on stock GitHub Actions Windows runners.
rusqlite = { version = "0.31", features = ["bundled-sqlcipher-vendored-openssl"] }
rand = "0.8"
hex = "0.4"
argon2 = "0.5"
thiserror = "1"
chrono = { version = "0.4", features = ["serde"] }
dirs = "5.0"
sentry = { version = "0.34", default-features = false, features = ["backtrace", "contexts", "panic", "reqwest", "rustls"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
regex = "1"
# Blocking SMTP client (rustls, no native OpenSSL needed) for emailing encrypted
# database backups to the user's own mailbox.
lettre = { version = "0.11", default-features = false, features = ["builder", "hostname", "smtp-transport", "rustls-tls", "pool"] }

# Windows-only: silent printing via the shell print verb (ShellExecuteW).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_UI_Shell",
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
] }
